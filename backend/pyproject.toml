[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "zakcerp-backend"
version = "0.1.0"
description = "ZakCERP — College ERP backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.1",
    "redis==5.0.4",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "minio==7.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.4.5",
    "mypy==1.10.0",
    "types-passlib==1.7.7.20240327",
    "types-python-jose==3.3.4.20240106",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = ["B008"]  # allow Depends() calls in function signatures

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*"]
